 <!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jarvis Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>JARVIS</h1>
    <p id="status">Sistema listo</p>

    <section id="chat">
      <p><strong>JARVIS:</strong> Hola. Soy tu primera interfaz web.</p>
    </section>

    <div>
      <input id="textInput" type="text" placeholder="Escribe un mensaje">
      <button id="sendButton" type="button">Enviar</button>
    </div>

    <button id="voiceButton" type="button">Hablar con Jarvis</button>

    <script src="app.js"></script>
  </main>
</body>
</html>
